name: CodeQL (Swift)

# Advanced setup, deliberately best-effort.
#
# Why Swift left the default-setup run: Swift is compiled, and CodeQL supports
# only `autobuild` and `manual` for it (`build-mode: none` exists for C/C++,
# C#, Java and Rust only). Under `manual`, CodeQL analyses ONLY what the build
# steps actually compile, so Swift findings are impossible without compiling
# Swift - there is no resolve-only mode.
#
# Compiling it here also requires `npm ci` first, because
# ios/App/CapApp-SPM/Package.swift (generated by the Capacitor CLI, marked
# "DO NOT MODIFY") declares ten local path dependencies straight into
# node_modules. That is exactly what made the default-setup autobuild fail with
# "Could not resolve package dependencies".
#
# So the iOS build is made CONDITIONAL rather than eliminated:
#   - `paths` gates this workflow to iOS-relevant changes, so an ordinary
#     JavaScript-only push never pays for a macOS runner or an Xcode build;
#   - the job is `continue-on-error`, so a Swift resolution or build problem
#     can never fail a push or block a merge.
# The always-on, gating analysis is JavaScript/TypeScript in codeql.yml.
#
# All Swift here is Capacitor-generated boilerplate (~120 lines), so if this job
# ever feels like more trouble than it is worth, delete this file - nothing
# depends on it.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/codeql-swift.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/codeql-swift.yml"
  schedule:
    # Weekly, offset from codeql.yml so the two never contend.
    - cron: "42 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: Analyze Swift (best-effort)
    # macos-15 + Xcode 16.4, matching the `ios` job in ci.yml.
    runs-on: macos-15
    # Non-blocking on purpose: this is coverage on generated boilerplate, so it
    # must never be able to fail a push or block a merge.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      # Required before CodeQL can resolve the SwiftPM graph: the Capacitor
      # manifest points at node_modules by relative path.
      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and copy it into the iOS project
        run: |
          npm run build
          npx cap copy ios

      # Mirrors the warm-up in ci.yml. SwiftPM resolvers are not safe to run
      # concurrently over one shared artifact cache: on a cold cache one loses
      # with "already exists in file system", then "Could not resolve package
      # dependencies" and exit 74 (swiftlang/swift-package-manager#10138).
      # A single serial resolve first means the build resolvers find the
      # artifact already present. `continue-on-error` because it is only a
      # warm-up and must never mask the real result.
      - name: Warm the SwiftPM artifact cache
        continue-on-error: true
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data"

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # `build-mode: manual` means CodeQL traces exactly this build and
      # analyses only what it compiles. Signing is disabled because entitlements
      # (HealthKit) cannot be embedded without a team, and this job gates source
      # analysis, not runtime HealthKit access.
      - name: Build the iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # `always()` so a failed build still finalises and uploads the CodeQL
      # database rather than leaving it dangling - but only when `init` ran, so
      # an earlier failure (e.g. npm ci) does not produce a bogus "database not
      # found" error.
      - name: Analyze
        if: always() && steps.init.outcome == 'success'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"