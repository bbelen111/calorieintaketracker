name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # v7+ because v4 targets Node 20, which GitHub now force-runs on Node 24
        # and reports as deprecated on every run.
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # '22.x' resolves to the newest 22 — Vitest 5 requires >= 22.12.0, so
          # pinning '22.0' would install an unusable runtime.
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI profile: same config as `npm run lint`, with the two pre-existing
      # React-Compiler advisory rules reported as warnings instead of errors
      # (see eslint.ci.config.js). Everything else is blocking.
      - name: Lint
        run: npm run lint:ci

      # Runs the logic tier with the same coverage floors CI enforces.
      - name: Logic tests + coverage floors
        run: npm run test:coverage

      - name: UI tests (jsdom)
        run: npm run test:ui

      - name: Build
        run: npm run build

      # Guards the documented Vite 8 / Rolldown `manualChunks` regression: the old
      # object-map form throws `manualChunks is not a function` and stops emitting
      # dist/index.html, which silently breaks `npx cap sync` on already-shipped
      # builds. Assert the output Capacitor needs is actually there.
      - name: Assert build output is Capacitor-syncable
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing — Capacitor would ship a broken bundle"
            exit 1
          fi

          for chunk in react capacitor framer-motion zustand lucide dexie; do
            if ! ls dist/assets | grep -q "^chunk-${chunk}-"; then
              echo "::error::chunk-${chunk}-*.js missing — check build.rollupOptions.output.manualChunks in vite.config.js"
              exit 1
            fi
          done

          if [ -z "$(ls dist/assets/*.css 2>/dev/null)" ]; then
            echo "::error::no CSS emitted into dist/assets"
            exit 1
          fi

          echo "Build output verified: dist/index.html + expected vendor chunks."

      # Deliberately `cap copy` (web assets + config only) rather than `cap sync`:
      # sync also runs the Gradle update step, which needs the Android SDK and
      # adds minutes for no extra signal here. The generated assets are gitignored.
      - name: Copy web assets into the Android project
        run: npx cap copy android

  # The iOS half of the release path. Kept as its own job (not a step in
  # `verify`) because it needs a macOS runner and is the slowest thing in CI.
  #
  # What this actually proves, and why each step earns its place:
  #  - `npm run build` + `npx cap copy ios`: the web bundle lands in
  #    `ios/App/App/public` (the same assertion the Android step makes);
  #  - `xcodebuild`: the Xcode project still compiles WITH every Capacitor plugin
  #    linked through Swift Package Manager. The SPM manifest references plugins
  #    by relative path into `node_modules` (`../../../node_modules/@capacitor/…`),
  #    so this is also the check that catches "plugin added to package.json but
  #    the iOS project was never re-synced" — which is otherwise only discovered
  #    at archive time.
  #
  # No CocoaPods anywhere: every plugin ships a `Package.swift`, so the project is
  # SPM-native (`ios.packageManager: "SPM"` in capacitor.config.json) and the
  # runner needs no `pod install`.
  ios:
    name: iOS build (SPM)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Copy web assets into the iOS project
        run: npx cap copy ios

      # SwiftPM downloads a package's binary artifacts (`Capacitor.xcframework.zip`
      # for capacitor-swift-pm) into one shared cache under
      # ~/Library/Caches/org.swift.swiftpm/artifacts, and its resolvers are not
      # safe to run concurrently: when two of them want the same artifact from a
      # cold cache, one loses and dies with
      #   failed downloading '...Capacitor.xcframework.zip' ... already exists in
      #   file system   →   Could not resolve package dependencies   →   exit 74
      # before a single file compiles. Upstream: swiftlang/swift-package-manager#10138
      # ("also happens with xcodebuild"); the fix was closed unmerged, so the Xcode
      # 16.4 toolchain macos-15 pins still has the race. It needs a COLD cache,
      # which is exactly what a fresh runner has — that is why this showed up only
      # once the job went to CI.
      #
      # `xcodebuild build` resolves the graph for both simulator slices, which is
      # the concurrency. Resolving ONCE here — a single serial resolve action, with
      # no destination to fan out over — warms the shared artifact cache first, so
      # the build's own resolvers find the artifact already present and download
      # nothing. `continue-on-error` because this step is only a warm-up: the build
      # below still resolves (and reports) for itself, so this must never be able to
      # replace or mask the real gate.
      - name: Warm the SwiftPM artifact cache
        continue-on-error: true
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data"

      # `generic/platform=iOS Simulator` builds for both simulator slices without
      # needing a booted device or a dev team. Signing is disabled because
      # entitlements (HealthKit) cannot be embedded without a team anyway — this
      # job gates compilation and plugin linking, not runtime HealthKit access,
      # which needs a signed build (see README → iOS).
      #
      # The retry is deliberately not blanket flakiness-tolerance: it fires ONLY on
      # the artifact-cache race above. Losing that race still leaves the WINNER's
      # copy in the shared cache, so a plain second attempt finds the artifact and
      # downloads nothing. Anything else — a Swift compile error, a plugin that is
      # not linked, a network fault that is not this race — exits on the first
      # attempt, immediately, exactly as before.
      - name: Build iOS app
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/ios-build.log"

          for attempt in 1 2 3; do
            if xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee "$log"; then
              exit 0
            fi

            if ! grep -qE 'already exists in file system|Could not resolve package dependencies' "$log"; then
              echo "::error::xcodebuild failed for a reason other than the SwiftPM artifact-cache race"
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::SwiftPM artifact-cache race survived 3 attempts — the cold-cache download keeps losing"
              exit 1
            fi

            echo "::warning::SwiftPM artifact-cache race on attempt $attempt; retrying against the now-warm cache"
          done

          exit 1
